[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ehv-agent"
version = "0.1.0"
description = "A serial multi-agent Claude workbench for your terminal"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anthropic>=0.75,<1", "textual>=1,<9", "filelock>=3.16,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[project.scripts]
ehv-agent = "ehv_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
